---
- name: Generate AAP Survey choices from GitHub directories
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    inventory_root: "/runner/project/inventories"
    target_job_template: "Patch System"

  tasks:

    ####################################################################
    # Find inventory files
    ####################################################################

    - name: Find inventory files
      ansible.builtin.find:
        paths: "{{ inventory_root }}"
        recurse: true
        file_type: file
        patterns:
          - "*.yml"
          - "*.yaml"
      register: inventory_files

    - name: Confirm inventory files were found
      ansible.builtin.assert:
        that:
          - inventory_files.matched | int > 0
        fail_msg: >-
          No inventory YAML files were found under
          {{ inventory_root }}

    ####################################################################
    # Build discovered targets
    ####################################################################

    - name: Initialize discovered target records
      ansible.builtin.set_fact:
        discovered_targets: []

    - name: Build discovered target records
      ansible.builtin.set_fact:
        discovered_targets: >-
          {{
            discovered_targets +
            [
              {
                'env': parts[0],
                'os': parts[1],
                'system': parts[2] | regex_replace('\.ya?ml$', '')
              }
            ]
          }}
      vars:
        relative_path: >-
          {{
            item.path
            | replace('/runner/project/inventories/', '')
          }}
        parts: "{{ relative_path.split('/') }}"
      loop: "{{ inventory_files.files }}"
      when: parts | length == 3
      loop_control:
        label: "{{ item.path }}"

    - name: Show discovered targets
      ansible.builtin.debug:
        var: discovered_targets

    ####################################################################
    # Create unique Survey choices
    ####################################################################

    - name: Build environment choices
      ansible.builtin.set_fact:
        environment_choices: >-
          {{
            discovered_targets
            | map(attribute='env')
            | unique
            | sort
            | list
          }}

    - name: Build OS choices
      ansible.builtin.set_fact:
        os_choices: >-
          {{
            discovered_targets
            | map(attribute='os')
            | unique
            | sort
            | list
          }}

    - name: Build system choices
      ansible.builtin.set_fact:
        system_choices: >-
          {{
            discovered_targets
            | map(attribute='system')
            | unique
            | sort
            | list
          }}

    - name: Show generated choices
      ansible.builtin.debug:
        msg:
          environments: "{{ environment_choices }}"
          operating_systems: "{{ os_choices }
