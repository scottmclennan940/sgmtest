---
- name: Discover Environments, OS Types and Systems
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    inventory_root: "{{ playbook_dir }}/../inventories"

  tasks:

    ####################################################################
    # Environments
    ####################################################################

    - name: Discover environments
      ansible.builtin.find:
        paths: "{{ inventory_root }}"
        recurse: false
        file_type: directory
      register: env_dirs

    - name: Build environment list
      ansible.builtin.set_fact:
        environments: >-
          {{
            env_dirs.files
            | map(attribute='path')
            | map('basename')
            | sort
            | list
          }}

    - name: Show environments
      ansible.builtin.debug:
        var: environments

    ####################################################################
    # OS Types under dev
    ####################################################################

    - name: Discover OS types in dev
      ansible.builtin.find:
        paths: "{{ inventory_root }}/dev"
        recurse: false
        file_type: directory
      register: os_dirs

    - name: Build OS list
      ansible.builtin.set_fact:
        os_types: >-
          {{
            os_dirs.files
            | map(attribute='path')
            | map('basename')
            | sort
            | list
          }}

    - name: Show OS types
      ansible.builtin.debug:
        var: os_types

    ####################################################################
    # Systems under dev/rhel
    ####################################################################

    - name: Discover systems in dev/rhel
      ansible.builtin.find:
        paths: "{{ inventory_root }}/dev/rhel"
        recurse: false
        file_type: file
        patterns: "*.yml"
      register: system_files

    - name: Build system list
      ansible.builtin.set_fact:
        systems: >-
          {{
            system_files.files
            | map(attribute='path')
            | map('basename')
            | map('regex_replace', '\.yml$', '')
            | sort
            | list
          }}

    - name: Show systems
      ansible.builtin.debug:
        var: systems

    ####################################################################
    # All Targets
    ####################################################################

    - name: Find all inventory files
      ansible.builtin.find:
        paths: "{{ inventory_root }}"
        recurse: true
        file_type: file
        patterns: "*.yml"
      register: inventory_files

    - name: Build target list
      ansible.builtin.set_fact:
        available_targets: >-
          {{
            inventory_files.files
            | map(attribute='path')
            | map('regex_replace', '^' + inventory_root + '/', '')
            | map('regex_replace', '\.yml$', '')
            | sort
            | list
          }}

    - name: Show available targets
      ansible.builtin.debug:
        var: available_targets
        
